name: PollMaster
options:
  bundleIdPrefix: com.evselab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: vi
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 566SKQXVZT
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  PollMasterCore:
    path: PollMasterCore
targets:
  PollMaster:
    type: application
    platform: iOS
    sources:
      - path: PollMaster
        excludes:
          - Info.plist
      # Bundled templates are shared with the Android app: referenced in place, not copied.
      - path: ../shared/templates
        type: folder
        buildPhase: resources
      # AI template-authoring guide, also shared with Android.
      - path: ../shared/huong-dan-tao-mau-bang-ai.md
        buildPhase: resources
    dependencies:
      - package: PollMasterCore
    info:
      path: PollMaster/Info.plist
      properties:
        CFBundleDisplayName: PollMaster
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only Apple's own crypto (HTTPS for template URLs), so every build skips the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "PollMaster cần dùng camera để chụp ảnh và quay video khảo sát."
        NSPhotoLibraryUsageDescription: "PollMaster cần truy cập thư viện ảnh để đính kèm ảnh và video vào phiếu khảo sát."
        NSLocationWhenInUseUsageDescription: "PollMaster dùng vị trí để ghi tọa độ điểm khảo sát và gắn vị trí vào ảnh."
        NSSpeechRecognitionUsageDescription: "PollMaster dùng nhận dạng giọng nói để chuyển lời nói thành chữ khi bạn ghi chú trong phiếu khảo sát."
        NSMicrophoneUsageDescription: "PollMaster cần micro để ghi âm bản ghi và quay video khảo sát."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.evselab.pollmaster.project
            UTTypeDescription: Gói dự án PollMaster
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [pmproject]
              public.mime-type: [application/zip]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Gói dự án PollMaster
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.evselab.pollmaster.project]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evselab.pollmaster
        PRODUCT_NAME: PollMaster
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: PollMaster
      # Release signs manually with the API-created profile (scripts/asc-setup.py). Set here, on the app target
      # only: passed on the xcodebuild command line it would also hit the SPM resource bundles, which refuse profiles.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PollMaster App Store
schemes:
  PollMaster:
    build:
      targets:
        PollMaster: all
    run:
      config: Debug
